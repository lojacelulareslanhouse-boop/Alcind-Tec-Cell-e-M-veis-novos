<!DOCTYPE html>

<head>

<style>

.btn{display:block;margin-top:5px;padding:6px;background:#25D366;color:#fff;text-align:center;border-radius:5px;text-decoration:none;font-weight:bold;font-size:13px}
.service{background:#fff;padding:15px;text-align:center;border:2px solid #ff9900;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center}

</head>

<div class="grid" id="grid"></div>

<script>
const REPO = "lojacelulareslanhouse-boop/Alcind-Tec-Cell-e-M-veis-novos";
const PASTAS = ["capas","moveis","eletronicos","acessorios","personalizados"];
const grid = document.getElementById('grid');

async function carregar(){
  // Produtos automaticos das pastas
  for(let pasta of PASTAS){

          }
        });
      }
    }catch(e){}
  }
  // Servicos fixos
  grid.innerHTML += `
  <div class="card service" data-cat="servicos"><div class="icon">🔧</div><h3>ASSISTÊNCIA TÉCNICA</h3><a class="btn" style="background:red" href="https://wa.me/5551998785137?text=Assistencia">Consultar</a></div>
  <div class="card service" data-cat="servicos"><div class="icon">📱🔧</div><h3>CONSERTO DE CELULAR</h3><a class="btn" style="background:red" href="https://wa.me/5551998785137?text=Conserto">Orçamento Grátis</a></div>
  <div class="card service" data-cat="servicos"><div class="icon">💻</div><h3>LAN HOUSE</h3><a class="btn" href="https://wa.me/5551998785137?text=Lan%20House">Consultar</a></div>
  <div class="card service" data-cat="servicos"><div class="icon">🖨️</div><h3>XEROX / SCANNER</h3><a class="btn" href="https://wa.me/5551998785137?text=Xerox">Consultar</a></div>
  <div class="card service" data-cat="servicos"><div class="icon">📸</div><h3>REVELAÇÃO FOTOS</h3><a class="btn" href="https://wa.me/5551998785137?text=Revelacao">Consultar</a></div>
  <div class="card service" data-cat="servicos"><div class="icon">🎨</div><h3>PERSONALIZADOS</h3><p>Caneca, Camiseta</p><a class="btn" style="background:#ff9900;color:#000" href="https://wa.me/5551998785137?text=Personalizados">Orçamento</a></div>
  `;
}
function f(cat,btn){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card').forEach(c=>{c.style.display=(cat==='todos'||c.dataset.cat===cat)?'block':'none';});
  document.querySelectorAll('.propaganda').forEach(p=>{p.style.display=(cat==='todos')?'block':'none';});
}
carregar();
</script>
</body>
</html>
